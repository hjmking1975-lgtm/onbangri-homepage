<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온스테이지 방콕 리트릿 | 학부모 동반 4주 영어 뮤지컬 캠프 · 2027년 1월 방콕</title>
<meta name="description" content="아이는 무대에, 가족은 방콕에. 2027년 1월, 서머셋 라마9에서 열리는 학부모 동반 30박 31일 영어 뮤지컬 캠프. 40명 전원 개별 배역, 마히돌대학교 블랙박스 시어터 피날레 공연.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#1e1424;
    --plum:#432a49;
    --plum-soft:#5a3d62;
    --gold:#c9a24b;
    --gold-soft:#e3cd96;
    --paper:#f8f5ef;
    --ink:#28202c;
    --muted:#6f6376;
    --line:#e5ddd2;
    --white:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.7;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Noto Serif KR', serif;}
  .wrap{max-width:860px; margin:0 auto; padding:0 22px;}
  section{padding:72px 0;}
  @media (max-width:640px){ section{padding:56px 0;} }

  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(30,20,36,.96); backdrop-filter:blur(6px);
    color:var(--gold-soft);
    padding:12px 0;
    border-bottom:1px solid rgba(201,162,75,.25);
  }
  .topbar .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .topbar .brand{font-weight:800; letter-spacing:.06em; font-size:14px; color:#fff;}
  .topbar .brand span{color:var(--gold);}
  .topbar a.cta-mini{
    background:var(--gold); color:var(--stage);
    font-weight:800; font-size:13px;
    padding:8px 16px; border-radius:999px; text-decoration:none;
    white-space:nowrap;
  }
  .topbar .right-group{display:flex; align-items:center; gap:12px;}
  .topbar .social-mini{display:flex; align-items:center; gap:6px;}
  .topbar .social-mini a{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%;
    border:1px solid rgba(201,162,75,.45);
    color:var(--gold-soft); text-decoration:none;
    transition:border-color .15s ease;
  }
  .topbar .social-mini a:hover{border-color:var(--gold);}
  .topbar .social-mini svg{width:16px; height:16px;}
  .topbar .right-cluster{display:flex; align-items:center; gap:22px;}
  .topbar .nav-links{display:flex; align-items:center; gap:20px;}
  .topbar .nav-links a{
    color:var(--gold-soft); text-decoration:none; font-size:13px; font-weight:500;
    white-space:nowrap;
  }
  .topbar .nav-links a:hover{color:var(--gold);}
  .topbar .nav-links a.active{color:var(--gold); font-weight:800;}
  @media (max-width:760px){ .topbar .nav-links{display:none;} }

  .hero{
    background:
      radial-gradient(ellipse 90% 55% at 50% -5%, rgba(201,162,75,.28), transparent 60%),
      linear-gradient(180deg, rgba(36,24,48,.88) 0%, rgba(30,20,36,.94) 70%),
      url('images/hero-hotel.jpg');
    background-size:cover; background-position:center;
    color:#fff; text-align:center;
    padding:96px 0 84px;
    position:relative; overflow:hidden;
  }
  .hero .eyebrow{
    display:inline-block;
    font-size:12px; letter-spacing:.34em; font-weight:700;
    color:var(--gold);
    padding-bottom:14px; margin-bottom:26px;
    border-bottom:1px solid rgba(201,162,75,.5);
  }
  .hero h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(30px, 6vw, 52px);
    line-height:1.35;
    letter-spacing:.01em;
  }
  .hero h1 .gold{color:var(--gold-soft);}
  .hero .lede{
    margin:26px auto 0; max-width:560px;
    font-size:clamp(15px,2.6vw,17.5px); color:#d9cfe0; font-weight:400;
  }
  .hero .facts{
    margin:36px auto 0;
    display:flex; justify-content:center; gap:0;
    flex-wrap:wrap;
    color:var(--gold-soft); font-size:13.5px; font-weight:500; letter-spacing:.02em;
  }
  .hero .facts span{padding:0 16px; position:relative;}
  .hero .facts span + span::before{
    content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:1px; height:12px; background:rgba(201,162,75,.5);
  }
  .cta-row{margin-top:44px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap;}
  a.btn{
    display:inline-block; text-decoration:none; font-weight:800;
    border-radius:999px; padding:16px 34px; font-size:16px;
    transition:transform .15s ease;
  }
  a.btn:active{transform:scale(.97);}
  a.btn-gold{background:var(--gold); color:var(--stage);}
  a.btn-ghost{border:1px solid rgba(255,255,255,.45); color:#fff;}
  .hero .deadline{
    margin-top:22px; font-size:13px; color:#b3a7bd;
  }
  .hero .deadline b{color:var(--gold-soft); font-weight:700;}

  .numbers{background:var(--plum); color:#fff; padding:0;}
  .numbers .wrap{
    display:grid; grid-template-columns:repeat(4,1fr);
    text-align:center;
  }
  .numbers .cell{padding:30px 8px; border-left:1px solid rgba(255,255,255,.12);}
  .numbers .cell:first-child{border-left:none;}
  .numbers .num{font-family:'Noto Serif KR',serif; font-weight:900; font-size:clamp(20px,4vw,30px); color:var(--gold-soft);}
  .numbers .lab{font-size:12.5px; color:#cdbfd6; margin-top:4px;}
  @media (max-width:640px){
    .numbers .wrap{grid-template-columns:repeat(2,1fr);}
    .numbers .cell:nth-child(3){border-left:none;}
    .numbers .cell{border-top:1px solid rgba(255,255,255,.12);}
    .numbers .cell:nth-child(-n+2){border-top:none;}
  }

  .sec-eyebrow{
    font-size:12px; letter-spacing:.28em; font-weight:800; color:var(--gold);
    margin-bottom:12px;
  }
  h2.sec-title{
    font-family:'Noto Serif KR',serif; font-weight:900;
    font-size:clamp(23px,4.4vw,32px); line-height:1.4;
    margin-bottom:22px;
  }
  .sec-lede{color:var(--muted); max-width:640px; margin-bottom:8px;}

  .story p{max-width:680px; margin-bottom:16px;}
  .story .pull{
    font-family:'Noto Serif KR',serif; font-weight:700;
    font-size:clamp(18px,3.4vw,22px); line-height:1.6;
    color:var(--plum);
    border-left:3px solid var(--gold);
    padding-left:20px; margin:30px 0;
  }

  .grid{display:grid; gap:16px; margin-top:34px;}
  .grid.g2{grid-template-columns:1fr 1fr;}
  @media (max-width:640px){ .grid.g2{grid-template-columns:1fr;} }
  .card{
    background:var(--white); border:1px solid var(--line); border-radius:16px;
    padding:26px 24px;
  }
  .card h3{font-size:17px; font-weight:800; color:var(--plum); margin-bottom:10px;}
  .card p{font-size:14.5px; color:#4c4353;}
  .card .tag{
    display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.08em;
    color:var(--gold); margin-bottom:10px;
  }

  .promise{background:var(--stage); color:#fff;}
  .promise .sec-eyebrow{color:var(--gold);}
  .promise h2{color:#fff;}
  .promise .lines{margin-top:30px; max-width:640px;}
  .promise .line{
    display:flex; gap:16px; padding:20px 0;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .promise .line:last-child{border-bottom:none;}
  .promise .mark{
    font-family:'Noto Serif KR',serif; font-weight:900; color:var(--gold);
    font-size:20px; line-height:1.4; flex:0 0 auto;
  }
  .promise .line h3{font-size:16.5px; font-weight:800; margin-bottom:4px;}
  .promise .line p{font-size:14.5px; color:#c9bdd2;}
  .promise .note{margin-top:26px; font-size:13px; color:#a294ad;}

  table{width:100%; border-collapse:collapse; background:var(--white); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:26px; font-size:15px;}
  th{background:var(--plum); color:#fff; text-align:left; padding:13px 16px;
